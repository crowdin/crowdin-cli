project_id: "{{projectId}}"
api_token: "{{token}}"
base_path: "."
base_url: "{{baseUrl}}"
preserve_hierarchy: true
files:
  - source: "/sources/files/*.csv"
    translation: "/sources/files/%two_letters_code%/%original_file_name%"
    first_line_contains_header: true
    scheme: "identifier, source_phrase, context, max_length, translation"
