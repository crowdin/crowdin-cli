project_id: "{{projectId}}"
api_token: "{{token}}"
base_path: "./files"
base_url: "https://api.crowdin.com"
preserve_hierarchy: true
files:
  # "%original_path%" is the source file's parent directory INCLUDING the source pattern's
  # fixed "en/" prefix - e.g. "en/src/main/resources" for "en/src/main/resources/android.xml" -
  # so "translation_replace" is what strips that "en/" back out and lands the file on
  # "it/src/main/resources/android.xml". Keeping both keys literal is the point of this suite:
  # "translation_replace" has nothing to do unless "%original_path%" carries a prefix.
  - source: "/en/**/*.xml"
    translation: "/%two_letters_code%/%original_path%/%original_file_name%"
    translation_replace:
      "/en": ""
