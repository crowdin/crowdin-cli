project_id: "{{projectId}}"
api_token: "{{token}}"
base_path: "."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true
files:
  # One file on purpose: a strings-based import locks the branch, so a second file uploaded
  # concurrently fails with "This branch is currently being updated".
  - source: "/sources/alpha.json"
    translation: "/translations/%two_letters_code%/%original_file_name%"
    context: "from %original_file_name%"
