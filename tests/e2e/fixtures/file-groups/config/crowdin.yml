project_id: "{{projectId}}"
api_token: "{{token}}"

base_path: "."
base_url: "{{baseUrl}}"
preserve_hierarchy: true

# '/sources/*.pot' never matches anything, on purpose. An empty group is reported and the run keeps
# going, so its position in the list does not change what gets uploaded.
files:
  - source: "/sources/*.properties"
    translation: "/translations/%two_letters_code%/%original_file_name%"
  - source: "/sources/*.xml"
    translation: "/translations/%two_letters_code%/%original_file_name%"
  - source: "/sources/android.xml"
    translation: "/translations/%two_letters_code%/%original_file_name%"
  - source: "/sources/*.pot"
    translation: "/translations/%two_letters_code%/%original_file_name%"
