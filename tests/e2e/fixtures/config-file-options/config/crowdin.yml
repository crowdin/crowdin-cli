project_id: "{{projectId}}"
api_token: "{{token}}"
base_path: "."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true
files:
  - source: "/sources/messages.properties"
    translation: "/translations/%two_letters_code%/%original_file_name%"
    escape_quotes: 3
    escape_special_characters: 0
  - source: "/sources/script.js"
    translation: "/translations/%two_letters_code%/%original_file_name%"
    export_quotes: "double"
  - source: "/sources/strings.xml"
    translation: "/translations/%two_letters_code%/%original_file_name%"
    type: "xml"
    content_segmentation: false
    translate_content: false
    translate_attributes: false
    translatable_elements:
      - "/catalog/item"
