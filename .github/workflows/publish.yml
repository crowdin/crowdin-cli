name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        required: true
        default: "all"
        options:
          - "all"
          - "npm"
          - "aur"
          - "homebrew"
          - "chocolatey"
          - "docker"
          - "winget"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release branch
        # Publish from main only. Fails (rather than skips) so it also blocks the channel jobs whose !failure() conditions tolerate a skipped assets chain
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "Publishing runs from main only (dispatched from $REF)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome check

      - name: Run tests
        run: bun run test

      - name: Build linux binary
        run: bun run build:linux-x64

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Smoke test binary version
        run: |
          version="${{ steps.version.outputs.version }}"
          out=$(./packages/npm/linux-x64/bin/crowdin --version)
          echo "manifest version: $version / binary version: $out"
          test "$out" = "$version"

  publish-platforms:
    needs: verify
    if: github.event.inputs.package == 'all' || github.event.inputs.package == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - darwin-arm64
          - darwin-x64
          - linux-x64
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:${{ matrix.package }}

      - name: Publish
        run: npm publish packages/npm/${{ matrix.package }}

  win-binary:
    # Bun's --windows-* PE metadata flags only work on a Windows host, so crowdin.exe is
    # built once here and reused by the npm package, the release asset and the installer
    needs: verify
    if: github.event.inputs.package == 'all' || github.event.inputs.package == 'npm'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Baseline build, so the win32-x64-baseline compile target matches the host
          # and bun doesn't download the target executable - that download is broken
          # on Windows hosts (oven-sh/bun#11198). Keep the version in sync with .bun-version
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-windows-x64-baseline.zip

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Build binary
        run: bun run build:win32-x64

      - name: Smoke test binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = & packages\npm\win32-x64\bin\crowdin.exe --version
          Write-Host "manifest version: $env:VERSION / binary version: $out"
          if ("$out" -ne $env:VERSION) { exit 1 }

      - name: Verify PE metadata
        # Catches the --windows-* flags silently falling out of the build script
        run: |
          $vi = (Get-Item packages\npm\win32-x64\bin\crowdin.exe).VersionInfo
          $vi | Format-List CompanyName, ProductName, FileDescription, FileVersion, LegalCopyright
          foreach ($field in 'CompanyName', 'ProductName', 'FileDescription', 'FileVersion') {
            if (-not $vi.$field) { throw "PE metadata field $field is empty" }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdin-exe
          path: packages/npm/win32-x64/bin/crowdin.exe
          if-no-files-found: error

  publish-win:
    # Publishes the win-binary exe as the win32-x64 npm package, so npm ships the same
    # binary as the release and the installer rather than a separate cross-compiled one
    needs: win-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crowdin-exe
          path: packages/npm/win32-x64/bin

      - name: Publish
        run: npm publish packages/npm/win32-x64

  # Last: the launcher pins exact platform-package versions, so it must never be published before its binaries
  publish-cli:
    needs: [publish-platforms, publish-win]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@11.18.0

      - name: Publish
        run: npm publish packages/npm/cli

  assets:
    # Builds the standalone binaries and creates the GitHub release once the npm packages are published
    needs: [publish-cli, win-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Build binaries
        # build:all covers the cross-compilable targets only; crowdin.exe comes from win-binary
        run: bun run build:all

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crowdin-exe
          path: release-assets

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            cp packages/npm/$platform/bin/crowdin release-assets/crowdin-$platform
          done
          cd release-assets
          shasum -a 256 crowdin* > crowdin-cli_checksums.sha256
          echo ${{ steps.version.outputs.version }} > version.txt

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*

  aur:
    runs-on: ubuntu-latest
    # Runs on a skipped (but not failed) assets chain too, so it can be dispatched alone against the latest existing release
    if: ${{ !failure() && !cancelled() && (github.event.inputs.package == 'all' || github.event.inputs.package == 'aur') }}
    needs: assets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Inject checksums
        # The pkgver is committed (release.config.js) and the download URLs derive from it;
        # only the sha256 of the released binaries is injected at publish time.
        # The version check fails fast on a missed bump.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkgbuild=packages/aur/pkgbuild/PKGBUILD
          pkgver=$(sed -n 's/^pkgver=//p' "$pkgbuild")
          if [ "$pkgver" != "$VERSION" ]; then
            echo "PKGBUILD pkgver ($pkgver) does not match packages/npm/cli version ($VERSION)"
            exit 1
          fi
          gh release download "$VERSION" --pattern crowdin-cli_checksums.sha256
          x64=$(awk '$2 == "crowdin-linux-x64" {print $1}' crowdin-cli_checksums.sha256)
          arm64=$(awk '$2 == "crowdin-linux-arm64" {print $1}' crowdin-cli_checksums.sha256)
          sed -i "s/__CHECKSUM_X64__/$x64/; s/__CHECKSUM_ARM64__/$arm64/" "$pkgbuild"
          cat "$pkgbuild"

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: crowdin-cli
          pkgbuild: ./packages/aur/pkgbuild/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR package
          ssh_keyscan_types: rsa,ecdsa,ed25519

  homebrew:
    runs-on: ubuntu-latest
    needs: assets
    # Runs on a skipped (but not failed) assets chain too, so it can be dispatched alone against the latest existing release
    if: ${{ !failure() && !cancelled() && (github.event.inputs.package == 'all' || github.event.inputs.package == 'homebrew') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Invoke workflow in the homebrew-crowdin repo
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: publish.yml
          repo: crowdin/homebrew-crowdin
          ref: refs/heads/master
          token: ${{ secrets.GH_HOMEBREW_TOKEN }}
          inputs: '{ "version": "${{ steps.version.outputs.version }}" }'

  chocolatey:
    runs-on: windows-latest
    needs: assets
    # Runs on a skipped (but not failed) assets chain too, so it can be dispatched alone against the latest existing release
    if: ${{ !failure() && !cancelled() && (github.event.inputs.package == 'all' || github.event.inputs.package == 'chocolatey') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release download "$env:VERSION" --pattern crowdin.exe --dir release-assets

      - name: Inject checksum
        # The nuspec version and download URL are committed (release.config.js);
        # only the checksum of the freshly-released binary is injected at pack time.
        # The version check fails fast on a missed manual bump.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $nuspecVersion = ([xml](Get-Content packages/chocolatey/crowdin-cli.nuspec)).package.metadata.version
          if ($nuspecVersion -ne $env:VERSION) { throw "nuspec version ($nuspecVersion) does not match packages/npm/cli version ($env:VERSION)" }
          $checksum = (Get-FileHash release-assets/crowdin.exe -Algorithm SHA256).Hash.ToLower()
          $install = 'packages/chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $install) -replace '__CHECKSUM__', $checksum | Set-Content $install
          Get-Content $install

      - name: Choco pack
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: pack packages/chocolatey/crowdin-cli.nuspec --outputdirectory packages/chocolatey

      - name: Smoke test package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install crowdin-cli --source "$PWD\packages\chocolatey" -y
          $out = crowdin --version
          Write-Host "package version: $env:VERSION / binary version: $out"
          if ("$out" -ne $env:VERSION) { exit 1 }

      - name: Choco push
        uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
        with:
          args: push packages/chocolatey/crowdin-cli.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.CHOCOLATEY_API_KEY }} --source=https://push.chocolatey.org/

  docker:
    # Builds the standalone binaries and pushes the multi-arch image to Docker Hub
    needs: verify
    if: github.event.inputs.package == 'all' || github.event.inputs.package == 'docker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Build binaries
        run: |
          bun run build:linux-x64-musl
          bun run build:linux-arm64-musl

      - name: Stage Docker context
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          cp packages/npm/linux-x64-musl/bin/crowdin binaries/amd64/crowdin
          cp packages/npm/linux-arm64-musl/bin/crowdin binaries/arm64/crowdin
          cp packages/docker/Dockerfile Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          tags: |
            "${{ secrets.DOCKER_HUB_REGISTRY_IMAGE }}:latest"
            "${{ secrets.DOCKER_HUB_REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}"

  winget:
    # Submits the standalone crowdin.exe from the GitHub release to winget-pkgs
    runs-on: windows-latest
    needs: assets
    # Runs on a skipped (but not failed) assets chain too, so it can be dispatched alone against the latest existing release
    if: ${{ !failure() && !cancelled() && (github.event.inputs.package == 'all' || github.event.inputs.package == 'winget') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - name: Submit to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: Crowdin.CrowdinCLI
          installers-regex: '^crowdin\.exe$'
          # The default release-tag comes from the release event, which never fires on workflow_dispatch
          release-tag: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GH_WINGET_TOKEN }}
          fork-user: crowdin-bot

  exe:
    # Wraps the Windows installer (Inno Setup) around the win-binary exe - the same binary
    # the release and the npm package ship - and attaches it to the GitHub release
    runs-on: windows-latest
    needs: [assets, win-binary]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        uses: ./.github/actions/read-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crowdin-exe
          # The path the .iss Source directive reads
          path: packages/npm/win32-x64/bin

      - name: Smoke test binary
        run: packages\npm\win32-x64\bin\crowdin.exe --version

      - name: Compile .ISS to .EXE Installer
        # Inno Setup is preinstalled on the windows runner image
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} packages\exe\CrowdinCLIInstaller.iss

      - name: Upload asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: crowdin-installer.exe
